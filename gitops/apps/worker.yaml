apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: worker
  namespace: argocd
spec: 
  project: default
  source:
    repoURL: https://github.com/GreatOmotayo/azure-aks-container-platform.git
    targetRevision: main
    path: charts/worker
  destination:
    server: https://kubernetes.default.svc
    namespace: app
  syncPolicy: 
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
