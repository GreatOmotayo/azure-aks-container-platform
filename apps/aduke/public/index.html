<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aduke — Dispatch</title>
<style>
  :root {
    --ink: #0F1B2B;
    --ink-raised: #162336;
    --line: #24334A;
    --text: #EDEFF2;
    --text-muted: #8592A6;
    --amber: #F2A65A;
    --teal: #4FD1C5;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    --sans: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--ink);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    padding: 2.5rem 1.25rem 4rem;
  }

  .wrap { max-width: 640px; margin: 0 auto; }

  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 2rem;
  }

  h1 {
    font-family: var(--mono);
    font-size: 1.15rem;
    font-weight: 600;
    letter-spacing: 0.02em;
    margin: 0;
  }

  h1::before {
    content: "";
    display: inline-block;
    width: 0.5em;
    height: 0.5em;
    background: var(--teal);
    border-radius: 50%;
    margin-right: 0.6em;
  }

  .subtitle {
    color: var(--text-muted);
    font-size: 0.85rem;
    margin-top: 0.35rem;
  }

  button.dispatch {
    background: var(--amber);
    color: #1a1305;
    border: none;
    font-family: var(--sans);
    font-weight: 600;
    font-size: 0.95rem;
    padding: 0.85rem 1.5rem;
    border-radius: 6px;
    cursor: pointer;
    transition: transform 0.08s ease, filter 0.15s ease;
  }

  button.dispatch:hover { filter: brightness(1.08); }
  button.dispatch:active { transform: scale(0.98); }
  button.dispatch:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }
  button.dispatch:disabled { opacity: 0.5; cursor: default; }

  .empty {
    color: var(--text-muted);
    font-size: 0.9rem;
    border: 1px dashed var(--line);
    border-radius: 8px;
    padding: 2rem 1rem;
    text-align: center;
    margin-top: 1.5rem;
  }

  .tickets { margin-top: 1.5rem; display: flex; flex-direction: column; gap: 0.75rem; }

  /* The signature element: a torn-ticket card, perforated left edge via a
     repeating gradient - a literal reference to dispatching a ticket into
     the queue, not a decorative flourish. */
  .ticket {
    position: relative;
    background: var(--ink-raised);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 1rem 1.25rem 1rem 1.75rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    animation: arrive 0.25s ease;
  }

  .ticket::before {
    content: "";
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 6px;
    background-image: repeating-linear-gradient(
      to bottom, var(--ink) 0 4px, transparent 4px 9px
    );
    background-color: var(--line);
  }

  @keyframes arrive {
    from { opacity: 0; transform: translateY(-4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .ticket-id {
    font-family: var(--mono);
    font-size: 0.82rem;
    color: var(--text-muted);
  }

  .ticket-result {
    font-size: 0.85rem;
    color: var(--text);
    margin-top: 0.25rem;
    word-break: break-word;
  }

  .status {
    font-family: var(--mono);
    font-size: 0.75rem;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    padding: 0.3rem 0.6rem;
    border-radius: 4px;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .status.queued { background: rgba(242, 166, 90, 0.15); color: var(--amber); }
  .status.done   { background: rgba(79, 209, 197, 0.15); color: var(--teal); }

  @media (prefers-reduced-motion: reduce) {
    .ticket { animation: none; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <h1>Aduke Dispatch</h1>
        <div class="subtitle">Send a job, watch it clear the queue.</div>
      </div>
      <button class="dispatch" id="dispatchBtn">Dispatch job</button>
    </header>

    <div id="emptyState" class="empty">No jobs dispatched yet.</div>
    <div id="tickets" class="tickets"></div>
  </div>

  <script>
    const dispatchBtn = document.getElementById('dispatchBtn');
    const ticketsEl = document.getElementById('tickets');
    const emptyState = document.getElementById('emptyState');
    const pollers = new Map();

    function renderTicket(job) {
      let el = document.getElementById('ticket-' + job.jobId);
      if (!el) {
        el = document.createElement('div');
        el.className = 'ticket';
        el.id = 'ticket-' + job.jobId;
        ticketsEl.prepend(el);
      }
      el.innerHTML = `
        <div>
          <div class="ticket-id">${job.jobId}</div>
          ${job.result ? `<div class="ticket-result">${job.result}</div>` : ''}
        </div>
        <div class="status ${job.status === 'done' ? 'done' : 'queued'}">${job.status}</div>
      `;
    }

    function pollJob(jobId) {
      if (pollers.has(jobId)) return;
      const interval = setInterval(async () => {
        try {
          const res = await fetch(`/jobs/${jobId}`);
          if (!res.ok) return;
          const job = await res.json();
          renderTicket(job);
          if (job.status === 'done') {
            clearInterval(interval);
            pollers.delete(jobId);
          }
        } catch (err) {
          // Network hiccup mid-poll - stay silent and let the next tick retry,
          // rather than surfacing a transient error to the person watching.
        }
      }, 2000);
      pollers.set(jobId, interval);
    }

    dispatchBtn.addEventListener('click', async () => {
      dispatchBtn.disabled = true;
      try {
        const res = await fetch('/jobs', { method: 'POST' });
        const job = await res.json();
        emptyState.style.display = 'none';
        renderTicket(job);
        pollJob(job.jobId);
      } catch (err) {
        alert('Could not dispatch job - check that Aduke is reachable.');
      } finally {
        dispatchBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
