apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: worker
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app: worker
  policyTypes:
    # Egress only - deliberately no Ingress restriction here
    - Egress

  egress:
    # DNS - same reasoning as Aduke's policy
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

    # Azure Storage (Queue + Table) and Key Vault private endpoints
    - to:
        - ipBlock:
            cidr: {{ .Values.networkPolicy.privateEndpointSubnetCidr }}
      ports:
        - protocol: TCP
          port: 443

    # Entra ID token exchange - same unresolved Firewall-coverage
    # question flagged in Aduke's NetworkPolicy applies here identically.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443