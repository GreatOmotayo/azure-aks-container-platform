replicaCount: 2
image:
  repository: "omotayoaksregistry.azurecr.io/worker"
  tag: "60b5bae6ad2c5088da167b3c0a7902bcf0701290"
  pullPolicy: IfNotPresent
serviceAccount:
  name: worker
  azureClientId: "da664b4d-465d-4113-8598-006a2f68f74b"
healthPort: 3001
resources:
  requests:
    cpu: 250m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
probes:
  liveness:
    path: /healthz
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  readiness:
    path: /ready
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
keyVault:
  secretName: worker-storage-config # separate Secret name from Aduke's, even though the value is identical 
  name: "omotayo-aks-kv"
  vaultUri: "https://omotayo-aks-kv.vault.azure.net/"
azureTenantId: "175d86cd-6e18-4ee9-84a6-c6b0d003ecc9"
networkPolicy:
# No ingressControllerNamespace here - unlike Aduke, this pod's
# NetworkPolicy doesn't restrict Ingress at all (see main design note
# above: nothing legitimately calls this pod over the network except
# kubelet's own probes, and restricting Ingress risks breaking those
# for no real security benefit).
# No further values needed - the sole egress ipBlock rule is a fixed
# 0.0.0.0/0, not templated from a variable (see templates/networkpolicy.yaml).
