replicaCount: 2
image:
  repository: "REPLACE_WITH_ACR_LOGIN_SERVER/worker"
  tag: "46fab640ebb64f1a08a8a63da4965923be6af310"
  pullPolicy: IfNotPresent
serviceAccount:
  name: worker
  azureClientId: "REPLACE_WITH_TERRAFORM_OUTPUT"
healthPort: 3001
resources:
  requests:
    cpu: 250m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
probes:
  liveness:
    path: /healthz
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  readiness:
    path: /ready
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
keyVault:
  secretName: worker-storage-config # separate Secret name from Aduke's, even though the value is identical 
  name: "REPLACE_WITH_TERRAFORM_OUTPUT"
  vaultUri: "REPLACE_WITH_TERRAFORM_OUTPUT"
azureTenantId: "REPLACE_WITH_TERRAFORM_OUTPUT"
networkPolicy:
# No ingressControllerNamespace here - unlike Aduke, this pod's
# NetworkPolicy doesn't restrict Ingress at all (see main design note
# above: nothing legitimately calls this pod over the network except
# kubelet's own probes, and restricting Ingress risks breaking those
# for no real security benefit).
# No further values needed - the sole egress ipBlock rule is a fixed
# 0.0.0.0/0, not templated from a variable (see templates/networkpolicy.yaml).
