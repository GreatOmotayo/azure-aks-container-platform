replicaCount: 2 # - actual live count is governed by the HPA below once deployed

image:
  repository: "omotayoaksregistry.azurecr.io/aduke"
  tag: "1e880dec0f7c36e690c74d2ed4c8ccfc0530f0b4"
  pullPolicy: IfNotPresent

serviceAccount:
  name: aduke
  azureClientId: "671704e4-d227-4b4c-81f9-05d4483e121f"
service:
  port: 80
  targetPort: 3000 # matches Aduke's PORT default in server.js

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 2 # matches the PDB's minAvailable - never scales below what the disruption budget already assumes
  maxReplicas: 10 
  targetCPUUtilizationPercentage: 70

probes:
  liveness:
    path: /healthz
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  readiness:
    path: /ready
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5 
    failureThreshold: 3

ingress:
  enabled: true
  className: nginx
  host: aduke.local 
  path: /

keyVault:
  secretName: aduke-storage-config
  name: "REPLACE_WITH_TERRAFORM_OUTPUT" # module.key_vault.vault_name - the plain vault name
  vaultUri: "REPLACE_WITH_TERRAFORM_OUTPUT" # module.key_vault.vault_uri

azureTenantId: "REPLACE_WITH_TERRAFORM_OUTPUT" # required by the SecretProviderClass parameters

networkPolicy:
  ingressControllerNamespace: ingress-nginx