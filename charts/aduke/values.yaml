replicaCount: 2 # - actual live count is governed by the HPA below once deployed
image:
  repository: "omotayoaksregistry.azurecr.io/aduke"
  tag: "3dc8bbe6bd348adbc3bae8109a9ad9b84d0a8ad1"
  pullPolicy: IfNotPresent
serviceAccount:
  name: aduke
  azureClientId: "59f7edfa-f0da-4ee2-a37c-bcba4bd4d8e5"
service:
  port: 80
  targetPort: 3000 # matches Aduke's PORT default in server.js
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 256Mi
autoscaling:
  enabled: true
  minReplicas: 2 # matches the PDB's minAvailable - never scales below what the disruption budget already assumes
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
probes:
  liveness:
    path: /healthz
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  readiness:
    path: /ready
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
ingress:
  enabled: true
  className: nginx
  host: aduke.local
  path: /
keyVault:
  secretName: aduke-storage-config
  name: "omotayo-aks-kv" # module.key_vault.vault_name - the plain vault name
  vaultUri: "https://omotayo-aks-kv.vault.azure.net/" # module.key_vault.vault_uri
azureTenantId: "175d86cd-6e18-4ee9-84a6-c6b0d003ecc9" # required by the SecretProviderClass parameters
networkPolicy:
  ingressControllerNamespace: ingress-nginx
