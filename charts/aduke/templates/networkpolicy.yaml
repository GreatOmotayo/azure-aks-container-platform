apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: aduke
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app: aduke
  policyTypes:
    - Ingress
    - Egress

  ingress:
    # ONLY the Ingress Controller can reach Aduke directly
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressControllerNamespace }}
      ports:
        - protocol: TCP
          port: {{ .Values.service.targetPort }}

  egress:
    # DNS - always required, regardless of anything else this pod talks to
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

    # Azure Storage (Queue + Table), Key Vault, and Entra ID token
    # exchange - all reached over public endpoints 
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443